name: Build Desktop App (Tauri)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: '--target x86_64-pc-windows-msvc'
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: ubuntu-latest
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install dependencies
        run: bun install

      - name: Generate Prisma client
        run: bunx prisma generate
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NODE_OPTIONS: --max-old-space-size=4096
        with:
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: 'Life Timeline ${{ github.ref_name }}'
          releaseBody: 'Desktop build of AI Life Timeline.'
          releaseDraft: false
          prerelease: false

  publish-release:
    if: always()
    needs: build-desktop
    runs-on: ubuntu-latest
    steps:
      - name: Finalize draft release
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          RELEASE_ID=$(gh api repos/FarisAsim/ai-life-timeline/releases --jq '.[] | select(.draft==true and .tag_name=="${{ github.ref_name }}") | .id' | head -1)
          if [ -n "$RELEASE_ID" ]; then
            gh api -X PATCH repos/FarisAsim/ai-life-timeline/releases/$RELEASE_ID -f draft=false
            echo "Published release $RELEASE_ID"
          else
            echo "No draft release found, nothing to do"
          fi
