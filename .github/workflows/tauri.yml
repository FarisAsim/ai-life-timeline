name: Build Desktop App (Tauri)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: '--target x86_64-pc-windows-msvc'
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: ubuntu-latest
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install dependencies
        run: bun install

      - name: Generate Prisma client
        run: bunx prisma generate
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NODE_OPTIONS: --max-old-space-size=4096
        with:
          args: ${{ matrix.args }}

      - name: Find and list bundle files
        id: bundles
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path src-tauri/target -Recurse -File |
            Where-Object { $_.DirectoryName -match '[\\/]release[\\/]bundle[\\/]' -and $_.Extension -ne '.sig' -and $_.Name -notlike '*.zip' }
          $list = ($files | ForEach-Object { $_.FullName }) -join "`n"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "files<<EOF`n$list`nEOF"
          Write-Output "Found $($files.Count) bundle files"
          $files | ForEach-Object { Write-Output $_.FullName }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-${{ matrix.platform }}
          path: ${{ steps.bundles.outputs.files }}
          if-no-files-found: error

  publish-release:
    needs: build-desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create or update release and upload files
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          TAG="${{ github.ref_name }}"
          if [ "$TAG" = "main" ]; then TAG="v1.0.0"; fi
          RELEASE_ID=$(gh api repos/FarisAsim/ai-life-timeline/releases --jq '.[] | select(.tag_name=="'$TAG'") | .id' | head -1)
          if [ -z "$RELEASE_ID" ]; then
            RELEASE_ID=$(gh api -X POST repos/FarisAsim/ai-life-timeline/releases -f tag_name="$TAG" -f name="Life Timeline $TAG" -f body="Desktop build of AI Life Timeline." -f draft=false | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
            echo "Created release $RELEASE_ID for $TAG"
          else
            echo "Using existing release $RELEASE_ID for $TAG"
          fi
          for f in $(find artifacts -type f | sort); do
            NAME=$(basename "$f")
            echo "Uploading $NAME ..."
            gh api -X POST repos/FarisAsim/ai-life-timeline/releases/$RELEASE_ID/assets -F "name=$NAME" -F "file=@$f" >/dev/null || echo "failed: $NAME"
          done
          echo "DONE: https://github.com/FarisAsim/ai-life-timeline/releases/tag/$TAG"
